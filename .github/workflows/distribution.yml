name: Build installers (Windows EXE / macOS / Linux)

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: distribution-${{ github.ref }}
  cancel-in-progress: false

jobs:
  images:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: amd64, runner: ubuntu-22.04}
          - {arch: arm64, runner: ubuntu-24.04-arm}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build credential-free application and database payload
        env:
          EL_VERSION: release-${{ github.run_number }}-${{ github.sha }}
        run: python distribution/build_images.py --arch '${{ matrix.arch }}' --version "$EL_VERSION" --output 'release/payload-${{ matrix.arch }}'
      - uses: actions/upload-artifact@v4
        with:
          name: payload-${{ matrix.arch }}
          path: release/payload-${{ matrix.arch }}/
          compression-level: 0
          retention-days: 3
          if-no-files-found: error

  packages:
    needs: images
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows, arch: amd64, runner: windows-2022}
          - {os: linux, arch: amd64, runner: ubuntu-22.04}
          - {os: linux, arch: arm64, runner: ubuntu-24.04-arm}
          - {os: macos, arch: amd64, runner: macos-15-intel}
          - {os: macos, arch: arm64, runner: macos-15}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: payload-${{ matrix.arch }}
          path: release/payload
      - name: Cache vendor installers
        uses: actions/cache@v4
        with:
          path: release/installer-cache
          key: installers-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('distribution/build_installers.py', 'distribution/windows_setup.py') }}
      - run: python -m pip install -r distribution/requirements-build.txt
      - run: python distribution/package.py --payload release/payload --output release/public
      - name: Verify assembled package on its target OS
        shell: python
        run: |
          from pathlib import Path
          import json, os, subprocess, zipfile
          if os.name == 'nt':
              setup = next(Path('release/public').glob('EL-Setup-*.exe')).resolve()
              installed = Path('release/smoke/windows-installed').resolve()
              subprocess.run([str(setup), '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART',
                              '/SP-', '/TASKS=', '/DIR=' + str(installed),
                              '/LOG=' + str(Path('release/smoke-install.log').resolve())], check=True, timeout=600)
              subprocess.run([str(installed / 'el-launcher.exe'), 'verify', '--no-pause'], check=True, timeout=300)
              manifest = json.loads((installed / 'installers/manifest.json').read_text(encoding='utf-8'))
              assert set(manifest) == {'docker', 'wsl'}
              # Reinstall checks the same AppId/location. Silent Setup must not
              # start the platform, install Docker, or initialize a database.
              subprocess.run([str(setup), '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART',
                              '/SP-', '/TASKS=', '/DIR=' + str(installed)], check=True, timeout=600)
              subprocess.run([str(installed / 'el-launcher.exe'), 'verify', '--no-pause'], check=True, timeout=300)
              subprocess.run([str(installed / 'unins000.exe'), '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART'], check=True, timeout=180)
              assert not (installed / 'el-launcher.exe').exists()
              raise SystemExit(0)
          archive = next(Path('release/public').glob('*.zip'))
          with zipfile.ZipFile(archive) as bundle:
              if '${{ matrix.os }}' != 'linux':
                  root = archive.stem + '/'
                  installers = json.loads(bundle.read(root + 'installers/manifest.json'))
                  required = {'docker', 'wsl'} if '${{ matrix.os }}' == 'windows' else {'docker'}
                  assert set(installers) == required, 'Bundled installers are missing'
                  for installer in installers.values():
                      assert installer['system'] == '${{ matrix.os }}'
                      assert installer['architecture'] == '${{ matrix.arch }}'
                      assert bundle.getinfo(root + installer['path']).file_size > 0
              bundle.extractall('release/smoke')
          binary = next(Path('release/smoke').glob('*/el-launcher' + ('.exe' if os.name == 'nt' else '')))
          binary.chmod(0o755)
          subprocess.run([str(binary), 'verify', '--no-pause'], check=True)
      - name: Verify empty-database startup and retained restart on Linux
        if: matrix.os == 'linux'
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          binary = next(Path('release/smoke').glob('*/el-launcher'))
          try:
              subprocess.run([str(binary), 'start', '--no-browser', '--no-pause'], check=True, timeout=1200, stdout=subprocess.DEVNULL)
              subprocess.run([str(binary), 'stop', '--no-pause'], check=True, timeout=180, stdout=subprocess.DEVNULL)
              subprocess.run([str(binary), 'start', '--no-browser', '--no-pause'], check=True, timeout=1200, stdout=subprocess.DEVNULL)
          finally:
              subprocess.run([str(binary), 'stop', '--no-pause'], timeout=180, stdout=subprocess.DEVNULL)
      - uses: actions/upload-artifact@v4
        with:
          name: EL-${{ matrix.os }}-${{ matrix.arch }}
          path: release/public/*
          compression-level: 0
          retention-days: 14
          if-no-files-found: error

  publish-release:
    needs: packages
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: EL-*
          path: artifacts
          merge-multiple: true
      - name: Upload installers and publish Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EL_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('build-{0}-{1}', github.run_id, github.run_attempt) }}
          EL_IS_TAG: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          set -euo pipefail
          # A manual build tags the exact checked-out commit, never a later
          # default-branch head. Tagged builds require the existing tag.
          tag_args=(--target "$GITHUB_SHA")
          if [[ "$EL_IS_TAG" == "true" ]]; then
            tag_args=(--verify-tag)
          fi
          # Keep an incomplete upload hidden; publish automatically only after
          # every asset is uploaded. A failed draft upload can be retried, but
          # never replace binaries in an already published version.
          if existing_draft="$(gh release view "$EL_TAG" --json isDraft --jq .isDraft 2>/dev/null)"; then
            if [[ "$existing_draft" != "true" ]]; then
              echo "Release $EL_TAG is already published. Use a new version tag."
              exit 1
            fi
            gh release upload "$EL_TAG" artifacts/* --clobber
          else
            gh release create "$EL_TAG" "${tag_args[@]}" --draft --title "$EL_TAG" --notes 'Windows 下载 Assets 中的 EL-Setup-*.exe 双击安装，无需手动解压，内置 Docker Desktop、WSL 和数据库镜像；macOS 提供内置 Docker Desktop 的 ZIP；Linux 仍需通过软件源安装 Docker。系统授权、许可确认或重启仍需用户完成。' artifacts/*
          fi
          gh release edit "$EL_TAG" --draft=false
          release_url="$(gh release view "$EL_TAG" --json url --jq .url)"
          {
            echo '### Installers ready'
            echo
            echo "[Open Release and download the Windows EXE]($release_url)"
            echo
            echo 'Windows: download EL-Setup-*.exe from Release assets. No ZIP extraction is needed.'
            echo 'All installers were uploaded and this Release was published automatically.'
          } >> "$GITHUB_STEP_SUMMARY"
