# 212 单机生产编排：Spring Boot 同时提供 API 与已编译前端，对外只发布 17878。
# .env 保存主机、数据库凭据和镜像标签；容器数据目录使用命名卷持久化。
name: el-to-ck
services:
  app:
    # Every package run produces a timestamped tag. Keep the previous tag so a
    # failed upgrade can be rolled back without rebuilding from changed sources.
    image: el-to-ck:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    # Leaves native buffers, DuckDB and JVM metaspace room beyond the 2 GiB Java heap.
    mem_limit: ${APP_MEMORY_LIMIT:-4g}
    ports:
      # Only this web port is published. Backend API and frontend assets are
      # served together by Spring Boot on container port 17878.
      - "${BIND_ADDRESS:-0.0.0.0}:${HTTP_PORT:-17878}:17878"
    environment:
      DEPLOYMENT_MODE: external
      # application.yml in the image contains no credentials. The values below
      # come from the private .env file generated by docker/package_release.py.
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-test}
      TZ: ${TZ:-Asia/Shanghai}
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--Xms256m -Xmx2g -Duser.timezone=Asia/Shanghai}
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: "17878"
      APP_DATADIR: /app/data
      APP_WEBDIR: /app/web/dist

      # MySQL metadata connection on 212. A container cannot use
      # 127.0.0.1 for this database because that address belongs to the container.
      APP_METADATA_URL: ${METADATA_URL:?Please set METADATA_URL in .env}
      APP_METADATA_USERNAME: ${METADATA_USERNAME:?Please set METADATA_USERNAME in .env}
      APP_METADATA_PASSWORD: ${METADATA_PASSWORD:?Please set METADATA_PASSWORD in .env}
      APP_SECRETKEY: ${APP_SECRET_KEY:?Please set APP_SECRET_KEY in .env}
      APP_USER: ${ADMIN_USER:-admin}
      APP_PASSWORD: ${ADMIN_PASSWORD-}

      # CK_PROTOCOL and CK_PORT are one pair:
      #   native + 9000 -> ClickHouse native port
      #   native + 9001 -> a proxy that forwards native traffic to 9000
      #   http   + 8123 -> ClickHouse HTTP port
      #   http   + 8132 -> a proxy that forwards HTTP traffic to 8123
      APP_DEFAULTCK_HOST: ${CK_HOST:?Please set CK_HOST in .env}
      APP_DEFAULTCK_PROTOCOL: ${CK_PROTOCOL:-native}
      APP_DEFAULTCK_PORT: ${CK_PORT:-9000}
      APP_DEFAULTCK_DATABASE: ${CK_DATABASE:-default}
      APP_DEFAULTCK_USERNAME: ${CK_USERNAME:?Please set CK_USERNAME in .env}
      APP_DEFAULTCK_PASSWORD: ${CK_PASSWORD-}
      APP_DEFAULTCK_SECURE: ${CK_SECURE:-false}

      # Management credentials are used only for account/role provisioning.
      CK_MANAGEMENT_USERNAME: ${CK_MANAGEMENT_USERNAME:-}
      CK_MANAGEMENT_PASSWORD: ${CK_MANAGEMENT_PASSWORD:-}
      CK_MANAGEMENT_ENABLED: ${CK_MANAGEMENT_ENABLED:-true}
      CK_DATABASES: ${CK_DATABASES:-ods_data,dwd_data}
      LOGGING_LEVEL_COM_EL2CK_MAPPER: INFO
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_JDBC_CORE: INFO
      LOGGING_FILE_NAME: /app/data/logs/el-to-ck.log
      XXL_JOB_ENABLED: "false"
    volumes:
      # Never remove this named volume during normal upgrades: it contains logs,
      # uploads and other persistent application data.
      - app-data:/app/data
    stop_grace_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
volumes:
  app-data:
