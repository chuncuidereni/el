# 仅用于本地联调的 Kafka/Hive 模拟源，不随生产发布包部署。
# 端口绑定到 127.0.0.1，避免把无认证的开发服务暴露到局域网。
name: el2ck-mock-sources
services:
  kafka-init:
    image: alpine:3.20
    command: [chown, "1000:1000", /kafka-data]
    volumes:
      - kafka-data:/kafka-data
  kafka:
    image: apache/kafka:3.9.1
    hostname: kafka
    restart: unless-stopped
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:19092:19092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://127.0.0.1:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /tmp/kafka-data
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka-data:/tmp/kafka-data
    healthcheck:
      test: [CMD-SHELL, "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 12
  hive:
    image: apache/hive:4.0.1
    hostname: hive
    restart: unless-stopped
    ports:
      - "127.0.0.1:21000:10000"
      - "127.0.0.1:21002:10002"
    environment:
      SERVICE_NAME: hiveserver2
      SERVICE_OPTS: -Dhive.server2.enable.doAs=false -Dhive.metastore.warehouse.dir=/opt/hive/data/warehouse
    volumes:
      - hive-warehouse:/opt/hive/data/warehouse
      - ./samples:/samples:ro
volumes:
  kafka-data:
  hive-warehouse:
