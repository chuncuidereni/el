<!-- 站点品牌图标(Favicon):圆角矩形蓝色渐变底(带顶部高光)+ 居中白色数据库柱体 +
     外圈一对金色环形同步箭头(⟳)。箭头做成关于中心点 180° 对称、箭头方向贴合切线,
     线宽与圆角统一,16px 下清晰不糊。全矢量,任意尺寸不失真。 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4a93ff"/>
      <stop offset="1" stop-color="#0047c2"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>
  <rect width="32" height="32" rx="7" fill="url(#gloss)"/>
  <!-- 居中数据库柱体(白色):顶面椭圆 + 柱身 + 中段分盘弧线 -->
  <g fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="16" cy="13.2" rx="3.3" ry="1.35"/>
    <path d="M12.7 13.2 v5.4 a3.3 1.35 0 0 0 6.6 0 v-5.4"/>
    <path d="M12.7 15.9 a3.3 1.35 0 0 0 6.6 0"/>
  </g>
  <!-- 外圈环形同步双箭头(金色),半径 8、关于中心 180° 对称 -->
  <g fill="#ffd35c" stroke="#ffd35c" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M9.5 11 A8 8 0 0 1 22.5 11" fill="none"/>
    <path d="M24.1 13.0 L21.5 11.8 L23.5 10.2 Z" stroke="none"/>
    <path d="M22.5 21 A8 8 0 0 1 9.5 21" fill="none"/>
    <path d="M7.9 19.0 L10.5 20.2 L8.5 21.8 Z" stroke="none"/>
  </g>
</svg>
